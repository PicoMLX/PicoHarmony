[package]
name = "harmony_uniffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
openai-harmony = { version = "0.0.8", path = "../openai-harmony" }
uniffi = { version = "0.30.0", features = ["cli"] }
thiserror = "1"
serde_json = "1"

# Optimize the release build for size. The prebuilt macOS/iOS-sim static
# archives sit right at GitHub's 100 MB per-file limit; whole-program LTO plus
# size-focused codegen trims dead code across the whole dependency tree (incl.
# openai-harmony's `image` codecs) so the slices stay under the limit. This
# changes only size vs. speed — no functionality is removed. `strip` is left at
# "debuginfo" (not "symbols") so the FFI's exported symbols remain linkable.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
