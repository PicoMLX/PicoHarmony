# Rebuilds Binaries/harmony_uniffiFFI.xcframework on a macOS runner, verifies
# the Swift package against the fresh binaries, and commits the result back to
# the branch it was dispatched from.
#
# This runs on demand only (workflow_dispatch). The committed binaries depend
# on the pinned `rust/openai-harmony` submodule commit, the `rust/harmony_uniffi`
# wrapper crate, and the packaging script — all of which change deliberately and
# infrequently (mostly when the upstream OpenAI harmony repo is updated). A
# ~20-minute rebuild that force-commits binaries back to the branch is a poor
# fit for an automatic push trigger, so trigger it by hand after bumping the
# submodule or changing the wrapper/build script:
#   Actions -> Build XCFramework -> Run workflow (pick the target branch).
name: Build XCFramework

on:
  workflow_dispatch:
  # TEMPORARY: build on push to this fix branch so the deep-bundle rebuild can
  # be produced and committed back without an interactive workflow_dispatch.
  # Remove before merging to main - main must stay dispatch-only. The commit-back
  # step pushes with GITHUB_TOKEN, which does not re-trigger this push event.
  push:
    branches: [ "claude/macos-framework-deep-bundle" ]

permissions:
  contents: write

concurrency:
  group: build-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build harmony_uniffiFFI.xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Package.swift declares swift-tools-version 6.2, which needs Xcode 26+.
      # Pick the newest non-beta Xcode on the runner image.
      - name: Select latest stable Xcode
        run: |
          # `sort -V` works on the macos runner's sort, but guard the result: if
          # detection yields nothing, keep the runner's default Xcode rather than
          # feeding an empty path to xcode-select. `swift build` later fails
          # clearly if the selected toolchain is too old.
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          echo "Using $(xcode-select -p)"
          swift --version

      - name: Install Rust toolchain and Apple targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/harmony_uniffi

      - name: Build XCFramework
        run: ./scripts/build_uniffi.sh

      - name: Verify package builds against rebuilt binaries
        run: swift build

      - name: Run tests
        run: swift test

      # Commit-back only makes sense on a mutable branch. workflow_dispatch can
      # also be run against a tag; skip the commit in that case rather than
      # trying (and failing) to push onto an immutable tag ref.
      - name: Commit rebuilt binaries
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Binaries rust/harmony_uniffi/Sources/PicoHarmonyGenerated
          if git diff --cached --quiet; then
            echo "Rebuilt output identical to committed binaries; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild harmony_uniffiFFI.xcframework"
          # The rebuild takes ~20 min, so the branch may have advanced while it
          # ran. Rebase the binary commit onto the latest tip and retry rather
          # than failing on a non-fast-forward push. Only Binaries/ and the
          # generated bindings change here, so the rebase is conflict-free in
          # practice; abort and fail loudly if it isn't.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (branch moved?); rebasing on latest and retrying (${attempt})..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          echo "Failed to push rebuilt binaries after retries." >&2
          exit 1
